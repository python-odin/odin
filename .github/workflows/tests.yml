name: Run Tests

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        experimental: [false]
        include:
          - python-version: "3.16-dev"
            experimental: true

    steps:
    - uses: actions/checkout@v3
      with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

    - name: Cache SonarQube packages
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.sonar/cache
        key: ${{ runner.os }}-sonar
        restore-keys: ${{ runner.os }}-sonar

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true

    - name: Install dependencies
      run: |
        uv sync --all-extras

    - name: Test with pytest
      run: |
        uv run pytest \
          --cov=odin \
          --cov-branch \
          --junit-xml=reports/xunit-result-${{ matrix.python-version }}.xml \
          --cov-report=xml:reports/coverage-${{ matrix.python-version }}.xml \
          tests

    - name: SonarQube Scan
      uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
